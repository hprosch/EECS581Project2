<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Minesweeper</title>

        <style>

            /* center the game on the page (Ruben Pino-Martinez, 10/10/2026) */
            /* Original page layout: Chris Brush, 10/7/2026; restyling: Ruben Pino-Martinez, 10/10/2026. */
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 0 16px;
                box-sizing: border-box;
                background: #f5f7fb;
                color: #263247;
                text-align: center;
            }

            /* use the same sizing rules across the whole page (Ruben Pino-Martinez, 10/10/2026) */
            * {
                box-sizing: border-box;
            }

            /* keep everything in one centered area (Ruben Pino-Martinez, 10/10/2026) */
            .game-shell {
                width: 100%;
                max-width: 730px;
                margin: 32px auto 48px;
            }

            /* give the game title some space to breathe (Ruben Pino-Martinez, 10/10/2026) */
            h1 {
                margin: 0 0 24px;
                font-size: 30px;
                letter-spacing: -0.7px;
            }

            /* group the game settings without taking up too much space (Ruben Pino-Martinez, 10/10/2026) */
            /*
            AI USE (by Ruben Pino-Martinez, 10/10/2026): game layout cleanup
            How/why AI was used:
            ChatGPT helped with a small visual cleanup of the running game
            after I shared screenshots and asked for a cleaner UI.
            AI-assisted section:
            Matching panels for the settings and board, with borders and spacing.
            */
            .controls,
            .game-panel {
                border: 1px solid #e4e9f1;
                border-radius: 14px;
                background: #ffffff;
                box-shadow: 0 4px 18px rgba(37, 52, 75, 0.045);
            }

            .controls {
                padding: 22px;
                margin-bottom: 18px;
            }

            /* keep the two sliders side by side (Ruben Pino-Martinez, 10/10/2026) */
            /*
              AI USE (by Ruben Pino-Martinez, 10/10/2026): slider layout
              How/why AI was used:
              ChatGPT helped document the spacing used for the two setting sliders.
              AI-assisted section:
              The two-column settings layout; slider behavior was not changed.
            */
            .settings-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 26px;
                margin-bottom: 22px;
            }

            .setting label {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 11px;
                color: #49576b;
                font-size: 14px;
                font-weight: 600;
            }

            /* make the current slider value stand out a bit (Ruben Pino-Martinez, 10/10/2026) */
            .setting label span {
                color: #2463b3;
                font-weight: 700;
            }

            .setting input[type="range"] {
                display: block;
                width: 100%;
                margin: 0;
                accent-color: #3877c8;
                cursor: pointer;
            }

            /* put the game modes together so they're easier to find (Ruben Pino-Martinez, 10/10/2026) */
            /*
            AI USE (by Ruben Pino-Martinez, 10/10/2026): game mode controls
            How/why AI was used:
            ChatGPT helped organize the mode buttons so the options were
            easier to scan without changing what each button does.
            AI-assisted section:
            The flex layout for the game mode buttons.
            */
            .mode-buttons {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 9px;
            }

            /* give the buttons a consistent look (Ruben Pino-Martinez, 10/10/2026) */
            button {
                min-height: 39px;
                padding: 9px 13px;
                border: 1px solid #cbd7e6;
                border-radius: 8px;
                background: #f9fbfe;
                color: #2e4563;
                font: inherit;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 120ms ease, border-color 120ms ease;
            }

            /* lightly highlight a button when the mouse is over it (Ruben Pino-Martinez, 10/10/2026) */
            button:hover {
                background: #edf4ff;
            }
            /* show which control is selected when using the keyboard (Ruben Pino-Martinez, 10/10/2026) */
            /*
              AI USE (by Ruben Pino-Martinez, 10/10/2026): keyboard focus styling
              How/why AI was used:
              ChatGPT helped explain why the keyboard focus outline is included.
              AI-assisted section:
              The focus-visible CSS styling for buttons and sliders.
            */
            button:focus-visible,
            input:focus-visible {
                outline: 3px solid #9ec6ff;
                outline-offset: 2px;
            }

            /* make the regular player mode easier to notice (Ruben Pino-Martinez, 10/10/2026) */
            .mode-buttons button:first-child {
                background: #326cbd;
                color: #ffffff;
            }

            .mode-buttons button:first-child:hover {
                background: #265da9;
            }

            /* give the reveal ability its own button color (Ruben Pino-Martinez, 10/10/2026) */
            #revealButton {
                margin-top: 11px;
            }

            #revealButton:hover {
                background: #fff1d3;
            }

            .setting-note {
                margin: 12px 0 0;
                font-size: 12px;
                color: #7c889b;
            }

            .game-panel {
                padding: 22px 16px 20px;
            }

            #status {
                margin: 0 auto 16px;
                font-size: 14px;
                font-weight: 700;
            }

            /* hide this message area when there is nothing to say (Ruben Pino-Martinez, 10/10/2026) */
            #status:empty {
                display: none;
            }

            /*
              AI USE (by Ruben Pino-Martinez, 10/10/2026): game status message
              How/why AI was used:
              ChatGPT helped explain the UI treatment of win and loss messages.
              AI-assisted section:
              The message box styling when a status message is present.
            */
            #status:not(:empty) {
                width: fit-content;
                max-width: 100%;
                padding: 10px 14px;
                border-radius: 8px;
                background: #eef4ff;
                color: #275b9b;
            }

            /* show the timer and flags side by side (Ruben Pino-Martinez, 10/10/2026) */
            /*
            AI USE (by Ruben Pino-Martinez, 10/10/2026): timer and flag display
            How/why AI was used:
            ChatGPT helped place the existing game stats in a cleaner layout
            so the timer and remaining flags were easier to read.
            AI-assisted section:
            The .stats display and spacing; flag-count logic remains in JavaScript.
            */
            .stats {
                display: flex;
                justify-content: center;
                gap: 44px;
                margin-bottom: 23px;
            }

            /* stack the label above each game stat (Ruben Pino-Martinez, 10/10/2026) */
            .stat {
                display: flex;
                flex-direction: column;
                gap: 5px;
                min-width: 120px;
            }

            .stat-label {
                color: #6b788c;
                font-size: 12px;
            }

            .stat-value {
                color: #253349;
                font-size: 20px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }

            /* allow the board to scroll if it gets too wide (Ruben Pino-Martinez, 10/10/2026) */
            /*
              AI USE (by Ruben Pino-Martinez, 10/10/2026): board scrolling
              How/why AI was used:
              ChatGPT helped document how the board can stay usable on narrower screens.
              AI-assisted section:
              The horizontal overflow styling around the game board.
            */
            .board-wrap {
                max-width: 100%;
                overflow-x: auto;
                padding: 0 0 4px;
            }

            /* keep the board cells together (Ruben Pino-Martinez, 10/10/2026) */
            /* Existing table layout rules: Chris Brush, 10/7/2026; updated board styles: Ruben Pino-Martinez, 10/10/2026. */
            table {
                border-collapse: collapse;
                margin: 0 auto;
            }

            #board th {
                width: 46px;
                height: 27px;
                color: #6a788e;
                font-size: 12px;
                font-weight: 700;
            }

            #board tr th:first-child {
                width: 27px;
                min-width: 27px;
                padding-right: 7px;
                text-align: right;
            }

            /* set the size and look of each tile (Ruben Pino-Martinez, 10/10/2026) */
            /* Existing tile sizing/interaction rules: Chris Brush, 10/7/2026; revised styling: Ruben Pino-Martinez, 10/10/2026. */
            td {
                width: 46px;
                min-width: 46px;
                height: 46px;
                padding: 0;
                text-align: center;
                border: 1px solid #bbc8d9;
                background: #f0f4f9;
                cursor: pointer;
                font-size: 21px;
                font-weight: 700;
                transition: background-color 100ms ease;
            }

            /* highlight a tile before the player clicks it (Ruben Pino-Martinez, 10/10/2026) */
            #board td:hover:not(.revealed):not(.aiHit) {
                background: #dceafa;
            }

            /* shade tiles that have been opened (Ruben Pino-Martinez, 10/10/2026) */
            /* Original revealed-tile CSS: Chris Brush, 10/7/2026; revised color: Ruben Pino-Martinez, 10/10/2026. */
            .revealed {
                background: #d9e2ed;
            }

            /* make the mine the ai hit stand out (Ruben Pino-Martinez, 10/10/2026) */
            .aiHit {
                background: #253349;
            }

            /* keep the two mouse instructions neatly below the board (Ruben Pino-Martinez, 10/10/2026) */
            .instructions {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px 24px;
                margin: 19px 0 0;
                color: #647187;
                font-size: 12px;
            }

            .instructions b {
                color: #38465c;
            }

            /* keep the controls and board usable on smaller screens (Ruben Pino-Martinez, 10/10/2026) */
            /*
            AI USE (by Ruben Pino-Martinez, 10/10/2026): small-screen layout
            How/why AI was used:
            ChatGPT suggested CSS adjustments to keep the controls and board
            usable when the screen is narrower.
            AI-assisted section:
            Smaller tile sizes and tighter spacing inside this media query.
            */
            @media (max-width: 540px) {
                .game-shell {
                    margin-top: 22px;
                }
                h1 {
                    font-size: 27px;
                    margin-bottom: 19px;
                }
                .controls {
                    padding: 18px 15px;
                }
                .settings-grid {
                    gap: 16px;
                }
                .mode-buttons button {
                    flex: 1 1 150px;
                }
                .stats {
                    gap: 12px;
                    justify-content: space-around;
                }
                .stat {
                    min-width: 0;
                }
                #board th {
                    width: 36px;
                    height: 23px;
                }
                td {
                    width: 36px;
                    min-width: 36px;
                    height: 36px;
                    font-size: 17px;
                }
            }
        </style>
    </head>

    <body>
        <main class="game-shell">
            <h1>Minesweeper</h1>

            <!-- Original slider values/actions: Chris Brush, 10/7/2026, except Wyatt Payne's credited difficulty slider (9/29/2026). -->
            <!-- New controls layout: Ruben Pino-Martinez, 10/10/2026. -->
            <section class="controls" aria-label="Game settings">
                <div class="settings-grid">
                    <div class="setting">
                        <!-- mine count -->
                        <label for="mineSlider">Mines: <span id="mineCount">10</span></label>
                        <!-- slider details -->
                        <input type="range" id="mineSlider" min="10" max="20" value="10"
                            oninput="document.getElementById('mineCount').textContent = this.value">
                    </div>
                    <div class="setting">
                        <!--AI Difficulty Slider-->
                        <!--Creates a slider that sets the difficulty of the AI player from 0-2 Easy-Hard
                        written by Wyatt Payne 9/29/26-->
                        <label for="difficultySlider">Difficulty: <span id="difficulty">Easy</span></label>
                        <input type="range" id="difficultySlider" min="0" max="2" value="0"
                            oninput="document.getElementById('difficulty').textContent = updateDifficulty()">
                    </div>
                </div>
                <!-- let the player pick which game mode to start (Ruben Pino-Martinez, 10/10/2026) -->
                <!-- Existing mode button actions carried over from Chris Brush's 10/7/2026 version. -->
                <!-- New grouping and presentation: Ruben Pino-Martinez, 10/10/2026. -->
                <div class="mode-buttons">
                    <button onclick="userPlayer()">New Game: User Player</button>
                    <button onclick="tagTeam()">New Game: Tag-Team</button>
                    <button onclick="aiPlayer()">New Game: AI Player</button>
                </div>
                <!-- use the one-time 3x3 reveal ability (Ruben Pino-Martinez, 10/10/2026) -->
                <button id="revealButton" onclick="activateRevealAbility()">Use 3x3 Reveal</button>
                <!-- remind players when the new settings actually apply (Ruben Pino-Martinez, 10/10/2026) -->
                <p class="setting-note">Mines and difficulty apply when you start a new game.</p>
            </section>

            <!-- Original status, timer, flag counter, and board elements: Chris Brush, 10/7/2026. -->
            <!-- Updated organization and visual styling: Ruben Pino-Martinez, 10/10/2026. -->
            <section class="game-panel" aria-label="Minesweeper board">
                <!-- display win or loss messages here (Ruben Pino-Martinez, 10/10/2026) -->
                <p id="status" role="status" aria-live="polite"></p>
                <div class="stats">
                    <!-- display how long the game has been running (Ruben Pino-Martinez, 10/10/2026) -->
                    <div class="stat"><span class="stat-label">Game time</span><span class="stat-value" id="timer">00:00</span></div>
                    <!-- show how many flags the player has left (Ruben Pino-Martinez, 10/10/2026) -->
                    <div class="stat"><span class="stat-label">Flags remaining</span><span class="stat-value" id="flagCount">0</span></div>
                </div>
                <div class="board-wrap">
                    <!-- javascript will build the board inside this table (Ruben Pino-Martinez, 10/10/2026) -->
                    <table id="board"></table>
                </div>
                <p class="instructions"><span><b>Left click:</b> Reveal cell</span><span><b>Right click:</b> Flag/unflag cell</span></p>
            </section>

        </main>

        <!-- load the game functions from the javascript file (Ruben Pino-Martinez, 10/10/2026) -->
        <script src="Minesweeper.js"></script>
    </body>

        <!-- Reload-time slider sync is new compared with the 10/7/2026 version; author/date not verified. -->
    <script>
        // run when the page is fully loaded
        document.addEventListener("DOMContentLoaded", function () {
            // set to true if you want to reset values on page reload
            // false if you don't
            let reset = false
            // make sure values is properly initalized
            if (!reset) {
                // fixes innaccurate slider on reload
                document.getElementById('difficulty').textContent = updateDifficulty();
                // fixes inacurate mine count on reload
                document.getElementById('mineCount').textContent = document.getElementById("mineSlider").value;
            }
            // put the sliders back to their starting values when reset is on (Ruben Pino-Martinez, 10/10/2026)
            else {
                document.getElementById('difficultySlider').value = "0";
                document.getElementById("mineSlider").value = 10;
                document.getElementById('difficulty').textContent = updateDifficulty();
                document.getElementById('mineCount').textContent = document.getElementById("mineSlider").value;
            }
        });
    </script>
</html>
